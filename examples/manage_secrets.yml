---
- name: Manage Bitwarden Secrets Manager secrets
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    bws_access_token: "{{ lookup('env', 'BWS_ACCESS_TOKEN') }}"
    organization_id: "<your-organization-id>"
    project_id: "<your-project-id>"

  tasks:
    - name: List secret keys in the project
      ansible.builtin.debug:
        msg: "{{ lookup('bitwarden.secrets.secrets', organization_id=organization_id, project_id=project_id, field='key') }}"

    - name: Query the organization
      ansible.builtin.debug:
        msg: "{{ lookup('bitwarden.secrets.organization', organization_id) }}"

    - name: Create or update a secret
      bitwarden.secrets.secret:
        state: present
        key: api_key
        value: "super-secret-value"
        note: "Managed by Ansible"
        project_id: "{{ project_id }}"
        access_token: "{{ bws_access_token }}"

    - name: Delete a secret by ID
      bitwarden.secrets.secret:
        state: absent
        secret_id: "<secret-id>"
        access_token: "{{ bws_access_token }}"
